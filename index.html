<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="banner">
      <div class="playback-controls">
        <div class="play-button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 14.09 18.52"
            width="14"
            height="18"
          >
            <g id="play">
              <polygon
                class="play-icon"
                points="14.09 9.26 0 0 0 18.52 14.09 9.26"
              />
            </g>
          </svg>
        </div>
        <div class="pause-button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 11.11 18.52"
            width="14"
            height="18"
          >
            <g id="pause">
              <g>
                <rect width="4.11" height="18.52" class="pause-icon" />
                <rect x="6.99" width="4.11" height="18.52" class="pause-icon" />
              </g>
            </g>
          </svg>
        </div>
        <div class="reverse-button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 16.58 18.04"
            width="16"
            height="18"
          >
            <defs>
              <style>
                .reverse-icon.text {
                  font-family: "Neue Haas Grotesk Display Pro";
                  font-size: 6.15px;
                  font-weight: 500;
                }
              </style>
            </defs>
            <g id="reverse">
              <g>
                <text
                  class="reverse-icon text"
                  transform="translate(6.29 11.92)"
                >
                  <tspan x="0" y="0">R</tspan>
                </text>
                <path
                  d="M15.22,5.2C13.11,2,9.15.73,5.68,1.88l-1.24-1.88L1.34,6.17l6.89-.4-1.09-1.66c2.24-.45,4.63.46,5.96,2.48,1.74,2.65,1.01,6.23-1.65,7.98-2.65,1.74-6.23,1.01-7.98-1.65-.9-1.37-1.14-2.97-.8-4.45l-2.6.15c-.27,1.92.13,3.95,1.28,5.69,2.51,3.82,7.66,4.89,11.48,2.37,3.82-2.51,4.89-7.66,2.37-11.48Z"
                  class="reverse-icon"
                />
              </g>
            </g>
          </svg>
        </div>
        <div class="resume-button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 14.09 18.52"
            width="14"
            height="18"
          >
            <g id="resume">
              <g>
                <polygon
                  points="14.09 9.26 0 0 0 18.52 14.09 9.26"
                  class="resume-icon"
                />
                <g>
                  <rect
                    x="10.95"
                    y="13.17"
                    width="1.16"
                    height="5.23"
                    class="resume-icon"
                  />
                  <rect
                    x="12.93"
                    y="13.17"
                    width="1.16"
                    height="5.23"
                    class="resume-icon"
                  />
                </g>
              </g>
            </g>
          </svg>
        </div>
        <div class="restart-button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 16.58 18.04"
            width="16.5"
            height="18"
          >
            <g id="restart">
              <g>
                <polygon
                  points="11.52 9.73 6.4 6.37 6.4 13.1 11.52 9.73"
                  class="restart-icon"
                />
                <path
                  d="M1.36,5.2C3.47,2,7.43.73,10.9,1.88l1.24-1.88,3.1,6.17-6.89-.4,1.09-1.66c-2.24-.45-4.63.46-5.96,2.48-1.74,2.65-1.01,6.23,1.65,7.98,2.65,1.74,6.23,1.01,7.98-1.65.9-1.37,1.14-2.97.8-4.45l2.6.15c.27,1.92-.13,3.95-1.28,5.69-2.51,3.82-7.66,4.89-11.48,2.37C-.09,14.17-1.15,9.02,1.36,5.2Z"
                  class="restart-icon"
                />
              </g>
            </g>
          </svg>
        </div>
      </div>
      <div class="progress-bar"></div>
    </div>
  </body>
</html>
